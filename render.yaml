services:
  - type: web
    name: campus-rooms
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campus-rooms-db
          property: connectionString
      - key: CAMPUS_TIMEZONE
        value: America/New_York
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: campus-rooms-db
    region: oregon
    plan: free
    databaseName: campus_rooms
    user: campus_rooms
